<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playoffs · La Catrina Pool League</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/otono2026.css">
    <style>
        .lock-wrap {
            min-height: 68vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem 4rem;
        }
        .lock {
            width: 74px;
            height: 74px;
            color: var(--gold);
            filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.28));
            margin-bottom: 1.8rem;
            animation: lockPulse 3.6s ease-in-out infinite;
        }
        @keyframes lockPulse {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.18)); }
            50% { filter: drop-shadow(0 0 26px rgba(212, 175, 55, 0.42)); }
        }
        .lock-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.3rem);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 0.9rem;
        }
        .lock-text {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--bone);
            max-width: 34rem;
            line-height: 1.6;
            margin: 0 0 0.4rem;
        }
        .lock-text strong { color: var(--gold-light); font-weight: 600; }
        .lock-sub {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 1.4rem 0 2.4rem;
        }
        .countdown {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 0.55rem;
        }
        .cd-cell {
            min-width: 5.2rem;
            padding: 0.9rem 0.6rem 0.75rem;
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 4px;
            background: linear-gradient(160deg, rgba(212, 175, 55, 0.08), rgba(0, 0, 0, 0.35));
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.04);
        }
        .cd-num {
            display: block;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 600;
            color: var(--gold-light);
            line-height: 1;
        }
        .cd-lab {
            display: block;
            margin-top: 0.55rem;
            font-family: var(--font-mono);
            font-size: 0.58rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .cd-done .cd-num { color: var(--muted); }
        @media (max-width: 480px) {
            .countdown { gap: 0.4rem; }
            .cd-cell { min-width: 0; flex: 1; padding: 0.7rem 0.3rem 0.6rem; }
            .cd-lab { letter-spacing: 0.1em; font-size: 0.52rem; }
            .lock-wrap { min-height: 62vh; }
        }
    </style>
</head>
<body class="otono">
    <nav class="ot-nav">
        <a href="../liga/">Clasificación</a>
        <a href="../calendar/">Calendario</a>
        <a href="../pendientes/">Pendientes</a>
        <a href="../playoffs/" class="active">Playoffs</a>
        <a href="../reglas/">Reglas</a>
    </nav>
    <main>
        <section class="ot-section wide">
            <div class="lock-wrap">
                <svg class="lock" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="13" y="28" width="38" height="27" rx="4"></rect>
                    <path d="M21 28 V19 a11 11 0 0 1 22 0 v9"></path>
                    <circle cx="32" cy="40" r="3.2" fill="currentColor" stroke="none"></circle>
                    <path d="M32 43.2 V47.5"></path>
                </svg>
                <h1 class="lock-title">Cuadro bloqueado</h1>
                <p class="lock-text">Los enfrentamientos de la <strong>repesca</strong> y de los <strong>octavos</strong> se publican mañana, <strong>sábado 24 de octubre a las 12:00</strong>.</p>
                <p class="lock-sub" id="cd-note">Faltan</p>
                <div class="countdown" id="cd" aria-live="polite">
                    <div class="cd-cell"><span class="cd-num" id="cd-d">00</span><span class="cd-lab">Días</span></div>
                    <div class="cd-cell"><span class="cd-num" id="cd-h">00</span><span class="cd-lab">Horas</span></div>
                    <div class="cd-cell"><span class="cd-num" id="cd-m">00</span><span class="cd-lab">Min</span></div>
                    <div class="cd-cell"><span class="cd-num" id="cd-s">00</span><span class="cd-lab">Seg</span></div>
                </div>
            </div>
        </section>
    </main>
    <footer class="ot-footer">
        La Catrina Pool League · Otoño 2026 · <a href="../liga/verano-2026/">Archivo: Verano 2026</a>
    </footer>
    <script src="../js/iris-cursor.js"></script>
    <script>
        (function () {
            // Sábado 24 de octubre de 2026, 12:00 hora peninsular (CEST, UTC+2)
            var target = new Date('2026-10-24T12:00:00+02:00').getTime();
            var cd = document.getElementById('cd');
            var note = document.getElementById('cd-note');
            var el = {
                d: document.getElementById('cd-d'),
                h: document.getElementById('cd-h'),
                m: document.getElementById('cd-m'),
                s: document.getElementById('cd-s')
            };
            function pad(n) { return String(n).padStart(2, '0'); }
            function tick() {
                var diff = target - Date.now();
                if (diff <= 0) {
                    cd.classList.add('cd-done');
                    note.textContent = 'El cuadro se está publicando';
                    el.d.textContent = '00';
                    el.h.textContent = '00';
                    el.m.textContent = '00';
                    el.s.textContent = '00';
                    return;
                }
                var s = Math.floor(diff / 1000);
                var d = Math.floor(s / 86400); s -= d * 86400;
                var h = Math.floor(s / 3600); s -= h * 3600;
                var m = Math.floor(s / 60); s -= m * 60;
                el.d.textContent = pad(d);
                el.h.textContent = pad(h);
                el.m.textContent = pad(m);
                el.s.textContent = pad(s);
                setTimeout(tick, 1000);
            }
            tick();
        })();
    </script>
</body>
</html>
